---
apiVersion: v1
kind: Service
metadata:
  name: directory-website
spec:
  type: ClusterIP
  selector:
    app: directory-website
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: directory-website
spec:
  serviceRef:
    name: directory-website
    port: 3000
    # Target Group need checking test
  targetGroupARN: arn:aws:elasticloadbalancing:ap-southeast-1:767397910274:targetgroup/directory/293239a0f3325341
